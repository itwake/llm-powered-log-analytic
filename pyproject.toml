[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "logan-platform"
version = "0.1.0"
description = "LLM-powered Log Analytics with Causal Inferencing platform foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2",
  "sqlalchemy>=2",
  "psycopg[binary]>=3",
  "bcrypt>=5",
  "cryptography>=42",
  "httpx>=0.27",
  "prometheus-client>=0.20"
]

[project.optional-dependencies]
dev = [
  "pytest>=9",
  "pytest-asyncio>=1",
  "ruff>=0.15"
]

[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: tests that require explicitly started service dependencies",
  "staging: opt-in tests that call real external staging services",
]

[tool.ruff]
line-length = 100
target-version = "py311"
