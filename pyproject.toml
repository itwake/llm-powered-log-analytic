[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "logan-platform"
version = "0.1.0"
description = "Incident log analysis with optional AI Platform enrichment"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2",
  "sqlalchemy>=2",
  "httpx>=0.27",
  "python-dotenv>=1"
]

[project.optional-dependencies]
dev = [
  "pytest>=9",
  "pytest-asyncio>=1",
  "ruff>=0.15"
]

[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
